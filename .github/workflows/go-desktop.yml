name: Go desktop foundation

on:
  pull_request:
    branches: [main, security/phase-1a-foundations, go/g1a-desktop-foundation, go/g1b-secure-remote-displays, go/g2a-journal-ingestion]
  push:
    branches: [go/g1a-desktop-foundation, go/g1b-secure-remote-displays, go/g2a-journal-ingestion, go/g2b-local-nav-exploration]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go/go.sum
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus-x11
      - run: npm ci --loglevel=error
      - name: Security regression tests
        run: npm test
      - name: Security lint
        run: npm run lint:security && npm run lint:go-assets
      - name: Asset fixture tests
        run: npm run test:go-assets
      - name: Build embedded React assets
        run: npm run build:go-assets
      - name: Verify pinned Go modules
        run: cd go && go mod download && go mod verify && git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: cd go && go test -count=1 -timeout=4m ./...
      - name: Go vet
        run: cd go && go vet ./...
      - name: Journal startup and revocation stress
        run: cd go && go test -count=25 -timeout=4m ./internal/journal ./internal/webapp -run 'TestReaderStartsBeforeGameDirectoryExists|TestReaderDirectoryAppearsBeforeFirstPollReplays|TestRevocationStopsGameFeed'
      - name: G2B projection stress
        run: cd go && go test -count=25 -timeout=4m ./internal/navstate ./internal/explorestate ./internal/gamestate ./internal/webapp -run 'TestRoute(NavRouteClearStaysCleared|AdvancesOnlyOnConfirmedArrival|OldCommanderCannotReuseSidecar)|TestExploration(DifferentFIDCannotShareBodies|IgnoresOutOfSystemScan)|TestG2B(ProfileSwitchClearsOldRouteAndBodies|RevokedViewerReceivesNoNewNavigationOrSurvey|BroadcastSnapshotsAreIndependent)'
      - name: Race detector
        if: runner.os == 'Linux'
        run: |
          cd go
          go test -race -count=1 -timeout=4m ./...
          go test -race -count=25 -timeout=4m ./internal/journal ./internal/webapp -run 'TestReaderStartsBeforeGameDirectoryExists|TestReaderDirectoryAppearsBeforeFirstPollReplays|TestRevocationStopsGameFeed'
          go test -race -count=25 -timeout=4m ./internal/navstate ./internal/explorestate ./internal/gamestate ./internal/webapp -run 'TestRoute(NavRouteClearStaysCleared|AdvancesOnlyOnConfirmedArrival|OldCommanderCannotReuseSidecar)|TestExploration(DifferentFIDCannotShareBodies|IgnoresOutOfSystemScan)|TestG2B(ProfileSwitchClearsOldRouteAndBodies|RevokedViewerReceivesNoNewNavigationOrSurvey|BroadcastSnapshotsAreIndependent)'
      - name: Build native desktop
        run: cd go && go build -o bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/daedalus
      - name: Allow this preview to create WebKit sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts unprofiled user namespaces. Grant only this
          # executable userns permission; keep WebKit's sandbox and global policy.
          sudo tee /etc/apparmor.d/daedalus-g1a-ci > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          "$GITHUB_WORKSPACE/go/bin/daedalus" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/daedalus-g1a-ci
      - name: Executable offline smoke
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --smoke-test
      - name: Native React smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-smoke-test
          else
            go/bin/daedalus.exe --desktop-smoke-test
          fi
      - name: Prepare synthetic journal fixture
        id: journal_fixture
        run: node scripts/build/journal-smoke-fixture.cjs
      - name: Executable journal smoke
        env:
          G2A_JOURNAL_DIR: ${{ steps.journal_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
      - name: Native journal smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2A_JOURNAL_DIR: ${{ steps.journal_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
          fi
      - name: Benchmark journal replay
        run: cd go && go test ./internal/journal -run '^$' -bench '^BenchmarkJournalReplay$' -benchmem -benchtime=3x
      - name: Prepare synthetic navigation fixture
        id: navigation_fixture
        run: node scripts/build/navigation-smoke-fixture.cjs
      - name: Executable navigation survey smoke
        env:
          G2B_JOURNAL_DIR: ${{ steps.navigation_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
      - name: Native navigation survey smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2B_JOURNAL_DIR: ${{ steps.navigation_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
          fi
      - name: Benchmark projection replay
        run: cd go && go test ./internal/gamestate -run '^$' -bench '^BenchmarkProjectionReplay$' -benchmem -benchtime=3x
      - name: Package experimental preview
        id: preview
        run: node scripts/build/package-go-preview.cjs
      - name: Upload experimental unsigned local route and survey preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daedalus-g2b-${{ runner.os }}-x64-experimental-unsigned-local-route-survey-no-uploads
          path: ${{ steps.preview.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
