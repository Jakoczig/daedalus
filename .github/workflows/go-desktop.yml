name: ERIDION Go desktop

on:
  pull_request:
    branches: [main, security/phase-1a-foundations, go/g1a-desktop-foundation, go/g1b-secure-remote-displays, go/g2a-journal-ingestion, go/g2b-local-nav-exploration, go/g2c-exploration-parity, go/g2d-original-ui-parity, go/g2e-feature-parity, go/g2f-usability-edsm, go/g2g-navigation-launcher, go/g2h-unified-navigation-integrations, go/g2j-persistent-history-integrations, go/g2k-native-field-operations, go/g2l-fleet-economy-commander-operations, go/g2m-a-eridion-identity-frontier, go/g2m-b-navigation-field-context, go/g2m-c-live-audit-functional-corrections, go/g2n-commander-fleet-completion, go/g2o-signed-galaxy-atlas-client, go/g2p-launcher-settings-frontier, go/g2q-galaxy-map-fidelity]
  push:
    branches: [go/g1a-desktop-foundation, go/g1b-secure-remote-displays, go/g2a-journal-ingestion, go/g2b-local-nav-exploration, go/g2c-exploration-parity, go/g2d-original-ui-parity]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go/go.sum
      - name: Verify native SQLite compiler
        run: gcc --version && go env CGO_ENABLED CC
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus-x11
      - run: npm ci --loglevel=error
      - name: Security regression tests
        run: npm test
      - name: Security lint
        run: npm run lint:security && npm run lint:go-assets
      - name: Asset fixture tests
        run: npm run test:go-assets
      - name: Build embedded React assets
        run: npm run build:go-assets
      - name: Verify pinned Go modules
        run: cd go && go mod download && go mod verify && git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: cd go && go test -count=1 -timeout=4m ./...
      - name: Go vet
        run: cd go && go vet ./...
      - name: Journal startup and revocation stress
        run: cd go && go test -count=25 -timeout=4m ./internal/journal ./internal/webapp -run 'TestReaderStartsBeforeGameDirectoryExists|TestReaderDirectoryAppearsBeforeFirstPollReplays|TestRevocationStopsGameFeed'
      - name: G2B projection stress
        run: cd go && go test -count=25 -timeout=4m ./internal/navstate ./internal/explorestate ./internal/gamestate ./internal/webapp -run 'TestRoute(SameTimestamp|SidecarMarkerBeforeAndAfterWrite|NavRouteClearStaysCleared|AdvancesOnlyOnConfirmedArrival|OldCommanderCannotReuseSidecar|UntimestampedClearCannotResurrectOldEvidence|CoordinatesRequireActualJSONNumbers|IncompleteArrivalClearsPreviousTarget)|TestExploration(DifferentFIDCannotShareBodies|IgnoresOutOfSystemScan)|TestG2B(ProfileSwitchClearsOldRouteAndBodies|RevokedViewerReceivesNoNewNavigationOrSurvey|BroadcastSnapshotsAreIndependent|MalformedRecordsBreakAttribution|ValidUnknownRecordPreservesContinuity)'
      - name: G2C details and organic stress
        run: cd go && go test -count=25 -timeout=4m ./internal/explorestate ./internal/gamestate ./internal/webapp -run '^TestG2C'
      - name: G2D ship and revocation stress
        run: cd go && go test -count=25 -timeout=4m ./internal/shipstate ./internal/webapp -run 'TestG2D|TestJournalShip|TestShipUnknown'
      - name: G2E attribution and revocation stress
        run: cd go && go test -count=25 -timeout=4m ./internal/paritystate ./internal/activitystate ./internal/webapp -run 'TestG2E|TestStatusCannot|TestCargo'
      - name: G2E transport efficiency and state benchmark
        run: |
          cd go
          go test -v ./internal/webapp -run '^TestG2EStatusUpdates'
          go test ./internal/paritystate -run '^$' -bench '^Benchmark(StatusApplyAndView|SnapshotClone)$' -benchmem -benchtime=500ms
      - name: Race detector
        if: runner.os == 'Linux'
        run: |
          cd go
          go test -race -count=1 -timeout=4m ./...
          go test -race -count=25 -timeout=4m ./internal/paritystate ./internal/activitystate ./internal/webapp -run 'TestG2E|TestStatusCannot|TestCargo'
          go test -race -count=25 -timeout=4m ./internal/shipstate ./internal/webapp -run 'TestG2D|TestJournalShip|TestShipUnknown'
          go test -race -count=25 -timeout=4m ./internal/explorestate ./internal/gamestate ./internal/webapp -run '^TestG2C'
          go test -race -count=25 -timeout=4m ./internal/journal ./internal/webapp -run 'TestReaderStartsBeforeGameDirectoryExists|TestReaderDirectoryAppearsBeforeFirstPollReplays|TestRevocationStopsGameFeed'
          go test -race -count=25 -timeout=4m ./internal/navstate ./internal/explorestate ./internal/gamestate ./internal/webapp -run 'TestRoute(SameTimestamp|SidecarMarkerBeforeAndAfterWrite|NavRouteClearStaysCleared|AdvancesOnlyOnConfirmedArrival|OldCommanderCannotReuseSidecar|UntimestampedClearCannotResurrectOldEvidence|CoordinatesRequireActualJSONNumbers|IncompleteArrivalClearsPreviousTarget)|TestExploration(DifferentFIDCannotShareBodies|IgnoresOutOfSystemScan)|TestG2B(ProfileSwitchClearsOldRouteAndBodies|RevokedViewerReceivesNoNewNavigationOrSurvey|BroadcastSnapshotsAreIndependent|MalformedRecordsBreakAttribution|ValidUnknownRecordPreservesContinuity)'
      - name: Build native desktop
        run: cd go && go build -o bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/daedalus
      - name: Allow this preview to create WebKit sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts unprofiled user namespaces. Grant only this
          # executable userns permission; keep WebKit's sandbox and global policy.
          sudo tee /etc/apparmor.d/daedalus-g1a-ci > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          "$GITHUB_WORKSPACE/go/bin/daedalus" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/daedalus-g1a-ci
      - name: Executable offline smoke
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --smoke-test
      - name: Native React smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-smoke-test
          else
            go/bin/daedalus.exe --desktop-smoke-test
          fi
      - name: Prepare synthetic journal fixture
        id: journal_fixture
        run: node scripts/build/journal-smoke-fixture.cjs
      - name: Executable journal smoke
        env:
          G2A_JOURNAL_DIR: ${{ steps.journal_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
      - name: Native journal smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2A_JOURNAL_DIR: ${{ steps.journal_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-journal-smoke-test --journal-dir "$G2A_JOURNAL_DIR"
          fi
      - name: Benchmark journal replay
        run: cd go && go test ./internal/journal -run '^$' -bench '^BenchmarkJournalReplay$' -benchmem -benchtime=3x
      - name: Prepare synthetic navigation fixture
        id: navigation_fixture
        run: node scripts/build/navigation-smoke-fixture.cjs
      - name: Executable navigation survey smoke
        env:
          G2B_JOURNAL_DIR: ${{ steps.navigation_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
      - name: Native navigation survey smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2B_JOURNAL_DIR: ${{ steps.navigation_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-navigation-smoke-test --journal-dir "$G2B_JOURNAL_DIR"
          fi
      - name: Benchmark projection replay
        run: cd go && go test ./internal/gamestate -run '^$' -bench '^BenchmarkProjectionReplay$' -benchmem -benchtime=3x
      - name: Prepare synthetic G2C fixture
        id: exploration_fixture
        run: node scripts/build/navigation-smoke-fixture.cjs --g2c
      - name: Executable G2C exploration smoke
        env:
          G2C_JOURNAL_DIR: ${{ steps.exploration_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --exploration-smoke-test --journal-dir "$G2C_JOURNAL_DIR"
      - name: Native G2C exploration smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2C_JOURNAL_DIR: ${{ steps.exploration_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-exploration-smoke-test --journal-dir "$G2C_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-exploration-smoke-test --journal-dir "$G2C_JOURNAL_DIR"
          fi
      - name: Benchmark cached exploration snapshots
        run: cd go && go test ./internal/explorestate -run '^$' -bench '^BenchmarkSurveySnapshot$' -benchmem -benchtime=200x
      - name: Prepare synthetic G2D fixture
        id: terminal_fixture
        run: node scripts/build/navigation-smoke-fixture.cjs --g2d
      - name: Executable G2D terminal smoke
        env:
          G2D_JOURNAL_DIR: ${{ steps.terminal_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --terminal-smoke-test --journal-dir "$G2D_JOURNAL_DIR"
      - name: Native G2D terminal smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2D_JOURNAL_DIR: ${{ steps.terminal_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-terminal-smoke-test --journal-dir "$G2D_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-terminal-smoke-test --journal-dir "$G2D_JOURNAL_DIR"
          fi
      - name: Prepare synthetic G2E fixture
        id: parity_fixture
        run: node scripts/build/navigation-smoke-fixture.cjs --g2e
      - name: Executable G2E parity smoke
        env:
          G2E_JOURNAL_DIR: ${{ steps.parity_fixture.outputs.directory }}
        run: go/bin/daedalus${{ runner.os == 'Windows' && '.exe' || '' }} --parity-smoke-test --journal-dir "$G2E_JOURNAL_DIR"
      - name: Native G2E parity smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2E_JOURNAL_DIR: ${{ steps.parity_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-parity-smoke-test --journal-dir "$G2E_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-parity-smoke-test --journal-dir "$G2E_JOURNAL_DIR"
          fi
      - name: Build loopback synthetic visual fixture
        run: cd go && go build -o bin/g2d-visual-fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/visual-fixture
      - name: Real browser visual and interaction verification
        run: node scripts/testing/g2d-visual.cjs
      - name: Upload fabricated visual comparison and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2d-synthetic-visual-${{ runner.os }}
          path: temp/g2d-visual
          if-no-files-found: error
          retention-days: 14
      - name: G2E real browser parity and performance verification
        run: node scripts/testing/g2e-visual.cjs
      - name: Upload G2E fabricated visual and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2f-synthetic-visual-${{ runner.os }}
          path: temp/g2e-visual
          if-no-files-found: error
          retention-days: 14
      - name: Native G2G companion lifecycle smoke
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          G2G_JOURNAL_DIR: ${{ steps.parity_fixture.outputs.directory }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- go/bin/daedalus --desktop-companion-smoke-test --journal-dir "$G2G_JOURNAL_DIR"
          else
            go/bin/daedalus.exe --desktop-companion-smoke-test --journal-dir "$G2G_JOURNAL_DIR"
          fi
      - name: G2G launcher navigation galaxy and display-controller visuals
        run: node scripts/testing/g2g-visual.cjs
      - name: Upload G2G visual and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2g-synthetic-visual-${{ runner.os }}
          path: temp/g2g-visual
          if-no-files-found: error
          retention-days: 14
      - name: G2H orbital statistics galaxy and provider privacy visuals
        run: node scripts/testing/g2h-visual.cjs
      - name: G2H provider observation benchmark
        working-directory: go
        run: go test ./internal/providers -run '^$' -bench BenchmarkG2H -benchmem -count=1
      - name: Upload G2H fabricated visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2h-synthetic-visual-${{ runner.os }}
          path: temp/g2h-visual
          if-no-files-found: error
          retention-days: 14
      - name: G2J database lifecycle performance
        run: |
          cd go
          go test ./internal/gamestate -run '^$' -bench '^BenchmarkG2JLifecycle$' -benchtime=1x -benchmem -count=1 | tee ../temp/g2j-lifecycle.txt
          cd ..
          node scripts/testing/g2j-baseline.cjs
          cd temp/g2j-exact-g2h-baseline/go
          go test ./internal/gamestate -run '^$' -bench '^BenchmarkG2HExactLifecycle$' -benchtime=1x -benchmem -count=1 | tee ../../g2j-baseline.txt
      - name: G2J database history and privacy visuals
        run: node scripts/testing/g2j-visual.cjs
      - name: Upload G2J synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2j-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2j-visual/*.png
            temp/g2j-visual/report.json
            temp/g2j-lifecycle.txt
            temp/g2j-baseline.txt
          if-no-files-found: error
          retention-days: 14
      - name: G2K exact G2J lifecycle comparison and field query performance
        run: |
          node scripts/testing/g2k-baseline.cjs
          cd temp/g2k-exact-g2j-baseline/go
          go test ./internal/gamestate -run '^$' -bench '^BenchmarkG2JLifecycle$' -benchtime=1x -benchmem -count=1 | tee ../../g2k-g2j-lifecycle.txt
          go build -o bin/g2k-baseline-fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/visual-fixture
          cd ../../../go
          go test ./internal/history -run '^$' -bench '^BenchmarkG2KFieldQueries$' -benchtime=10x -benchmem -count=1 | tee ../temp/g2k-field-queries.txt
      - name: G2K live Status statistics workload
        working-directory: go
        run: go test ./internal/gamestate -run '^$' -bench '^BenchmarkStatisticsLiveStatus$' -benchtime=1000x -benchmem -count=1 | tee ../temp/g2k-statistics-live.txt
      - name: G2K field operations browser verification
        run: node scripts/testing/g2k-visual.cjs
      - name: Upload G2K synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2k-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2k-visual/*.png
            temp/g2k-visual/report.json
            temp/g2k-g2j-lifecycle.txt
            temp/g2k-field-queries.txt
            temp/g2k-statistics-live.txt
          if-no-files-found: error
          retention-days: 14
      - name: G2L exact G2K lifecycle baseline and operations queries
        run: |
          node scripts/testing/g2l-baseline.cjs
          cd temp/g2l-exact-g2k-baseline/go
          go test ./internal/gamestate -run '^$' -bench '^BenchmarkG2JLifecycle$' -benchtime=1x -benchmem -count=1 | tee ../../g2l-g2k-lifecycle.txt
          go build -o bin/g2l-baseline-fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/visual-fixture
          cd ../../../go
          go test ./internal/history -run '^$' -bench '^BenchmarkG2LOperationsQueries$' -benchtime=10x -benchmem -count=1 | tee ../temp/g2l-queries.txt
      - name: G2L owner operations and upload-disabled market browser smoke
        run: node scripts/testing/g2l-visual.cjs
      - name: Upload G2L fabricated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g2l-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2l-visual/*.png
            temp/g2l-visual/report.json
            temp/g2l-g2k-lifecycle.txt
            temp/g2l-queries.txt
          if-no-files-found: error
          retention-days: 14
      - name: G2M-A exact G2L lifecycle comparison
        run: |
          node scripts/testing/g2ma-baseline.cjs
          cd temp/g2ma-exact-g2l-baseline/go
          go test ./internal/gamestate -run '^$' -bench '^BenchmarkG2JLifecycle$' -benchtime=1x -benchmem -count=1 | tee ../../g2ma-g2l-lifecycle.txt
          go build -o bin/g2ma-baseline-fixture${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/visual-fixture
      - name: G2M-A commander, fleet, goals and account browser smoke
        run: node scripts/testing/g2ma-visual.cjs
      - name: Upload G2M-A synthetic verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g2ma-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2ma-visual/*.png
            temp/g2ma-visual/report.json
            temp/g2ma-g2l-lifecycle.txt
            temp/g2j-lifecycle.txt
          if-no-files-found: error
          retention-days: 14
      - name: G2M-B navigation, Spansh, activity and exact galaxy geometry
        run: node scripts/testing/g2mb-visual.cjs
      - name: Upload G2M-B synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g2mb-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2mb-visual/*.png
            temp/g2mb-visual/report.json
          if-no-files-found: error
          retention-days: 14
      - name: G2M-C verified startup and keyboard navigation browser regressions
        run: node scripts/testing/g2mc-visual.cjs
      - name: Upload G2M-C synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g2mc-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2mc-visual/*.png
            temp/g2mc-visual/report.json
          if-no-files-found: error
          retention-days: 14
      - name: G2N account choice goals fleet and activity browser verification
        run: node scripts/testing/g2n-visual.cjs
      - name: Upload G2N synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g2n-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2n-visual/*.png
            temp/g2n-visual/report.json
          if-no-files-found: error
          retention-days: 14
      - name: G2O signed atlas cache benchmark
        run: cd go && go test ./internal/atlas -run '^$' -bench '^BenchmarkAtlasCachedStartup$' -benchtime=1x -benchmem -count=1 | tee ../temp/g2o-atlas-benchmark.txt
      - name: G2O offline atlas controls and projection browser verification
        run: node scripts/testing/g2o-visual.cjs
      - name: Upload G2O synthetic atlas evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g2o-synthetic-evidence-${{ runner.os }}
          path: |
            temp/g2o-visual/*.png
            temp/g2o-visual/report.json
            temp/g2o-atlas-benchmark.txt
          if-no-files-found: error
          retention-days: 14
      - name: G2P launcher settings and consent browser verification
        run: node scripts/testing/g2p-visual.cjs
      - name: Upload G2P synthetic launcher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eridion-g2p-synthetic-evidence-${{ runner.os }}
          path: temp/g2p-visual/
          if-no-files-found: error
          retention-days: 14
      - name: G2Q galaxy fidelity geometry and bounded renderer verification
        run: node scripts/testing/g2q-visual.cjs
      - name: Upload G2Q synthetic renderer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eridion-g2q-synthetic-evidence-${{ runner.os }}
          path: temp/g2q-visual/
          if-no-files-found: error
          retention-days: 14
      - name: G3C hybrid spatial map geometry and exact-coordinate Canvas
        run: node scripts/testing/g3c-visual.cjs
      - name: Upload G3C synthetic spatial evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eridion-g3c-synthetic-evidence-${{ runner.os }}
          path: temp/g3c-visual/
          if-no-files-found: error
          retention-days: 14
      - name: Package experimental preview
        id: preview
        run: node scripts/build/package-go-preview.cjs
      - name: Upload experimental unsigned local route and survey preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eridion-g3c-${{ runner.os }}-x64-experimental-unsigned-preview
          path: ${{ steps.preview.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
